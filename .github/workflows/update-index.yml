name: 更新应用索引

on:
  schedule:
    - cron: "23 */6 * * *"      # 每 6 小时跑一次（UTC）
  workflow_dispatch:            # 也可以在 Actions 页面手动点一下
  # 自己家的应用有新版本、或者改过抓取逻辑，推上来就立刻重跑。
  # 注意不要把 site/index.json 列进来，否则 Actions 自己提交索引又会触发一遍，形成死循环。
  push:
    paths:
      - "self/**"
      - "self_apps.py"
      - "export.py"
      - "curation.py"
      - "pinyin.py"
      - "source_dangbei.py"
      - ".github/workflows/update-index.yml"

permissions:
  contents: write

concurrency:
  group: index
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 装图标库
        run: pip install pillow

      # self_apk/ 是"进货口"：网页上传新 APK 到这里就行，
      # 这一步自动解析包名版本、抽图标、和老版本比 versionCode
      - name: 收录自研应用
        run: python self_apps.py scan

      - name: 抓取并生成索引
        run: python export.py --out site/index.json

      - name: 检查产出
        run: |
          test -s site/index.json
          python - <<'PY'
          import json
          d = json.load(open('site/index.json', encoding='utf-8'))
          print('应用数:', d['count'], '拦掉:', d.get('blocked'), '失败:', d['errors'])
          assert d.get('safe_only') is True, '索引必须标记 safe_only'
          # 现在白名单能放行 250+，低于 200 说明抓取大面积失败，宁可保留旧索引
          assert d['count'] > 200, '应用数异常偏低，保留旧索引不提交'
          assert len(d['errors']) < 8, '失败分类过多，保留旧索引不提交'
          PY

      - name: 提交
        run: |
          git config user.name  "index-bot"
          git config user.email "bot@users.noreply.github.com"
          git add site/index.json self
          git add app/assets/self_icon 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "索引没有变化，跳过提交"
          else
            git commit -m "auto: 更新应用索引 $(date -u '+%Y-%m-%d %H:%M')"
            # 远端可能在这几分钟里又有新提交（比如刚推送过代码），先合再推
            git pull --no-rebase -X theirs origin main && git push
          fi
